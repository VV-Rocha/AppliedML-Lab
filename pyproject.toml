[project]
name = "AppliedML-Lab"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
ml = [
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]
